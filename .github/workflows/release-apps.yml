name: Release apps
on:
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test build only: build the apps as downloadable artifacts and do not publish a release'
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-apps-${{ inputs.test_build && 'test' || 'release' }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MAC_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Signed and notarised when the signing secrets are set; otherwise an unsigned build.
      - name: Enable signing
        if: env.HAS_SIGNING == 'true'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.mac.identity;p.build.mac.hardenedRuntime=true;p.build.mac.notarize=true;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          if [ -n "$CSC_LINK" ]; then npx electron-builder --mac --publish never; else CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never; fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder signs when WIN_CSC_LINK is set.
      - run: npm run package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error
  release:
    needs: [macos, windows]
    # A test build stops here: its apps are on the run page as the "macos" and "windows" artifacts.
    if: ${{ !inputs.test_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-apps
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # The tag must match the version the apps report.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1; fi
          FILES=()
          while IFS= read -r file; do FILES+=("$file"); done < <(find dist-apps -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \))
          if [ "${#FILES[@]}" -eq 0 ]; then echo "No app artifacts"; exit 1; fi
          sha256sum "${FILES[@]}" | sed 's#  .*/#  #' > SHA256SUMS.txt
          FILES+=("SHA256SUMS.txt")
          NOTES=$'端末の中だけで完結する画像エディタ Imagee のデスクトップ版です。\n\n- Windows: `Imagee-win-setup.exe`\n- macOS（Apple シリコン）: `Imagee-mac-arm64.dmg`\n- macOS（Intel）: `Imagee-mac-x64.dmg`\n\nブラウザ版: https://tomo0108.github.io/Imagee/app/'
          if [ -f "docs/releases/$TAG.md" ]; then NOTES=$(cat "docs/releases/$TAG.md"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release replaces its files; a new version needs a version bump in package.json.
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "Imagee $VERSION" --notes "$NOTES" --generate-notes
          fi
