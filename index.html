<!doctype html>
<html lang="ja" data-theme="dark" data-motion="on">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#1c1c20"/>
    <meta name="description" content="Imagee"/>
    <meta name="application-name" content="Imagee"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Imagee"/>
    <link rel="manifest" href="./manifest.webmanifest"/>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png"/>
    <title>Imagee</title>
    <script>try{var p=JSON.parse(localStorage.getItem('imagee-preferences')||'{}');var t=p.theme==='light'?'light':p.theme==='system'&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.motion===false)document.documentElement.dataset.motion='off';if(p.accent)document.documentElement.dataset.accent=p.accent;if(p.lang==='en')document.documentElement.lang='en'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
